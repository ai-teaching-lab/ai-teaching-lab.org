<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="page">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  <div id="search-overlay" class="search-overlay" aria-hidden="true" role="dialog" aria-label="Search the site">
    <div class="search-overlay-inner">
      <div class="search-overlay-header">
        <span class="search-overlay-title">Search the Lab</span>
        <button id="search-close" class="search-close" type="button" aria-label="Close search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="search"></div>
      {{ if ne hugo.Environment "production" }}
      <p class="search-dev-note">Search index is built by the deploy pipeline. Local <code>hugo server</code> runs do not include results.</p>
      {{ end }}
    </div>
  </div>

  <script>
    (function() {
      const overlay = document.getElementById('search-overlay');
      const trigger = document.getElementById('search-trigger');
      const closeBtn = document.getElementById('search-close');
      let pagefindInited = false;

      function openSearch() {
        if (!overlay) return;
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.classList.add('search-open');
        if (!pagefindInited && typeof PagefindUI !== 'undefined') {
          new PagefindUI({
            element: '#search',
            showSubResults: true,
            showImages: false,
            resetStyles: false,
            placeholder: 'Search projects, toolkit, events…',
          });
          pagefindInited = true;
        }
        setTimeout(function() {
          const input = overlay.querySelector('input[type="text"]');
          if (input) input.focus();
        }, 80);
      }

      function closeSearch() {
        if (!overlay) return;
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('search-open');
        if (trigger) trigger.focus();
      }

      if (trigger) trigger.addEventListener('click', openSearch);
      if (closeBtn) closeBtn.addEventListener('click', closeSearch);
      if (overlay) overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeSearch();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && overlay && overlay.classList.contains('open')) {
          closeSearch();
        }
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          if (overlay && overlay.classList.contains('open')) {
            closeSearch();
          } else {
            openSearch();
          }
        }
      });
    })();
  </script>
</body>
</html>
