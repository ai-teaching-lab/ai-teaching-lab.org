{{ define "main" }}
<article class="wrapx">
  <p class="crumb">{{ site.Params.brandFormalName }} &nbsp;/&nbsp; <b>{{ .Title }}</b></p>
  <header class="page-header">
    <h1 class="display-2">{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <div class="prose" style="padding-top:36px; padding-bottom:56px">{{ .Content }}</div>
</article>
{{ end }}
