{{ define "main" }}
<article class="taxonomy">
  <header class="page-header">
    <p class="taxonomy-kind">{{ .Data.Singular | title }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  </header>
  <ul class="content-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">
        <h2>{{ .Title }}</h2>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </a>
    </li>
    {{ end }}
  </ul>
</article>
{{ end }}
