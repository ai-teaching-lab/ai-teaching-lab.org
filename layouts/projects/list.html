{{ define "main" }}
<article class="project-list">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  </header>
  <ul class="project-grid">
    {{ range .Pages }}
      {{ partial "project-card.html" . }}
    {{ end }}
  </ul>
</article>
{{ end }}
