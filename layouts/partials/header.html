<header class="site-header">
  <div class="institutional">
    <img src="/penn-tech-shield.svg" alt="" class="institutional-shield">
    <span>{{ site.Params.institutionName }}</span>
  </div>
  <div class="brand">
    <a href="/" class="brand-link">
      <img src="/heading-color.svg" alt="{{ site.Params.brandShortForm }}" class="brand-logo">
    </a>
  </div>
  <nav class="main-nav" aria-label="Main">
    <ul>
      {{ range site.Menus.main }}
      <li>
        {{- if .Params.placeholder -}}
          <a class="nav-link nav-disabled" title="Newsletter coming soon">{{ .Name }}{{ if .Params.external }}<span aria-hidden="true"> ↗</span>{{ end }}</a>
        {{- else -}}
          <a class="nav-link" href="{{ .URL }}"{{ if .Params.external }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}{{ if .Params.external }}<span aria-hidden="true"> ↗</span>{{ end }}</a>
        {{- end -}}
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
