<div class="penn-bar" aria-hidden="true"></div>
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <a href="/" class="brand-link" aria-label="{{ site.Params.brandShortForm }} home">
        <img src="/heading-color.svg" alt="{{ site.Params.brandShortForm }}" class="brand-logo">
      </a>
    </div>
    <nav class="main-nav" aria-label="Main">
      <ul>
        {{ range site.Menus.main }}
        <li>
          {{- if .Params.placeholder -}}
            <a class="nav-link nav-disabled" title="Newsletter coming soon">{{ .Name }}{{ if .Params.external }}<span aria-hidden="true"> ↗</span>{{ end }}</a>
          {{- else -}}
            <a class="nav-link" href="{{ .URL }}"{{ if .Params.external }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}{{ if .Params.external }}<span aria-hidden="true"> ↗</span>{{ end }}</a>
          {{- end -}}
        </li>
        {{ end }}
      </ul>
    </nav>
    <button id="search-trigger" class="search-trigger" type="button" aria-label="Open search" title="Search (⌘K)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="sr-only">Search</span>
    </button>
  </div>
</header>
